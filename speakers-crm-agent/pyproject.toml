[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speakers-crm-agent"
version = "0.1.0"
description = "Autonomous agent for PulseCore Speakers CRM (crm-speakers.com) driven by Claude Opus 5 via MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
speakers-crm-agent = "speakers_crm_agent.agent:main"

[tool.setuptools.packages.find]
include = ["speakers_crm_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
